const cats = ["All", ...new Set(tiles.map(t => t.cat))];
let activeCat = "All";
function render() {
  document.getElementById("catTabs").innerHTML = cats.map(c => `<button class="tab ${activeCat===c?'active':''}" onclick="activeCat='${c}';render()">${c}</button>`).join("");
  const list = activeCat === "All" ? tiles : tiles.filter(t => t.cat === activeCat);
  document.getElementById("grid").innerHTML = list.map(t => `
    <div class="card">
      <div class="row">
        <div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="${t.d}"/></svg></div>
        <div>
          <div style="font-size:13.5px;font-weight:600;">${t.name}</div>
          <div class="mono">${t.tier} | ic_qs_${t.id}</div>
        </div>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:8px;">${t.desc}</div>
    </div>
  `).join("");
}
function copyFailed() {
  const sample = "TileDeck v8.0 Self-Test: Ready on device (tap Copy Broken in Tester tab to copy any failing tiles).";
  navigator.clipboard?.writeText(sample);
  alert("Sample diagnostic report copied!");
}
function toggleTheme() {
  const h = document.documentElement;
  h.setAttribute("data-theme", h.getAttribute("data-theme") === "dark" ? "light" : "dark");
}
render();
</script>
