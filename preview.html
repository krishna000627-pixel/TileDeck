  .list { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px; margin-top:12px; }
  .card { background:#18181b; border:1px solid #27272a; border-radius:12px; padding:11px; }

let entered = "", shuffle = false, cat = "All";
function renderDots() {
  document.getElementById("dots").innerHTML = [0,1,2,3].map(i => `<div class="dot ${i<entered.length?'on':''}"></div>`).join("");
}
function renderPad() {
  let d = ["1","2","3","4","5","6","7","8","9","0"];
  if (shuffle) d = [...d].sort(() => Math.random() - 0.5);
  const keys = [...d.slice(0,9), "FP", d[9], "DEL"];
  document.getElementById("pad").innerHTML = keys.map(k => `<button class="key" onclick="tap('${k}')">${k}</button>`).join("");
}
function tap(k) {
  if (k === "DEL") entered = entered.slice(0,-1);
  else if (k === "FP") { entered = "1234"; setTimeout(() => { alert("Biometric Unlocked!"); entered=""; renderDots(); }, 100); }
  else if (entered.length < 4) { entered += k; if (entered.length === 4) setTimeout(() => { alert(entered==="1234"?"Unlocked!":"Wrong PIN logged"); entered=""; renderDots(); }, 120); }
  renderDots();
}
function renderFeats() {

}
